name: Android APK

# Builds the D-Agent APK (arm64-v8a) on every push and publishes it as a GitHub release
# tagged v1.0.<run number>, so the newest APK is always one tap away on the Releases page.
#
# Signing: if the repository secrets DAGENT_KEYSTORE_B64 / DAGENT_KEYSTORE_PASSWORD /
# DAGENT_KEY_ALIAS / DAGENT_KEY_PASSWORD exist, that key signs the APK. Otherwise a key is made
# once and kept in the Actions cache, so each new APK installs over the last one.

on:
  push:
    branches: [main, "claude/**"]
    paths-ignore: ["**.md"]
  workflow_dispatch:

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  NDK_VERSION: 27.2.12479018
  LLAMA_TAG: b12017

jobs:
  apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: platforms;android-35 build-tools;35.0.0 cmake;3.22.1 ndk;${{ env.NDK_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Linux engine (PRoot from Termux packages)
        run: |
          sudo apt-get install -y patchelf >/dev/null
          bash scripts/fetch-proot.sh app/src/main/jniLibs/arm64-v8a

      - name: On-phone model server cache
        id: llama
        uses: actions/cache@v4
        with:
          path: deps/llama-out/libllamaserver.so
          key: llama-server-${{ env.LLAMA_TAG }}-${{ hashFiles('scripts/build-llama-server.sh') }}

      - name: On-phone model server (llama.cpp)
        run: |
          export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/$NDK_VERSION"
          export PATH="$ANDROID_HOME/cmake/3.22.1/bin:$PATH"
          if [ ! -f deps/llama-out/libllamaserver.so ]; then
            bash scripts/build-llama-server.sh deps/llama-out || echo "::warning::llama-server build failed; the APK ships without on-phone models"
          fi
          if [ -f deps/llama-out/libllamaserver.so ]; then cp deps/llama-out/libllamaserver.so app/src/main/jniLibs/arm64-v8a/; fi
          ls -la app/src/main/jniLibs/arm64-v8a/

      - name: Core tests
        run: ./gradlew --no-daemon :core:test

      - name: Signing key (cache)
        uses: actions/cache@v4
        with:
          path: ~/.dagent-signing
          key: dagent-signing-v1

      - name: Signing key
        env:
          KS_B64: ${{ secrets.DAGENT_KEYSTORE_B64 }}
          KS_PASS: ${{ secrets.DAGENT_KEYSTORE_PASSWORD }}
          KS_ALIAS: ${{ secrets.DAGENT_KEY_ALIAS }}
          KS_KEYPASS: ${{ secrets.DAGENT_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          dir="$HOME/.dagent-signing"
          mkdir -p "$dir"
          if [ -n "${KS_B64:-}" ]; then
            echo "$KS_B64" | base64 -d > "$dir/secret.jks"
            {
              echo "DAGENT_KEYSTORE=$dir/secret.jks"
              echo "DAGENT_KEYSTORE_PASSWORD=$KS_PASS"
              echo "DAGENT_KEY_ALIAS=$KS_ALIAS"
              echo "DAGENT_KEY_PASSWORD=${KS_KEYPASS:-$KS_PASS}"
            } >> "$GITHUB_ENV"
          else
            if [ ! -f "$dir/ci.jks" ]; then
              pass="$(openssl rand -hex 16)"
              keytool -genkeypair -keystore "$dir/ci.jks" -storetype PKCS12 -alias dagent -keyalg RSA -keysize 4096 \
                -validity 10000 -dname "CN=D-Agent, O=deezi74, C=US" -storepass "$pass" -keypass "$pass"
              echo "$pass" > "$dir/pass"
              echo "Made a new signing key (kept in the Actions cache)."
            fi
            pass="$(cat "$dir/pass")"
            echo "::add-mask::$pass"
            {
              echo "DAGENT_KEYSTORE=$dir/ci.jks"
              echo "DAGENT_KEYSTORE_PASSWORD=$pass"
              echo "DAGENT_KEY_ALIAS=dagent"
              echo "DAGENT_KEY_PASSWORD=$pass"
            } >> "$GITHUB_ENV"
          fi

      - name: Build APK
        run: |
          export DAGENT_BUILD=$((GITHUB_RUN_NUMBER))
          echo "sdk.dir=$ANDROID_HOME" > local.properties
          ./gradlew --no-daemon :app:assembleRelease

      - name: Collect APK
        id: apk
        run: |
          apk="$(ls app/build/outputs/apk/release/*.apk | head -1)"
          out="D-Agent-1.0.${GITHUB_RUN_NUMBER}.apk"
          cp "$apk" "$out"
          bt="$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)"
          "$bt/aapt" dump badging "$out" | grep -E "^package:|application-label:|native-code" || true
          unzip -l "$out" | grep "lib/arm64" || true
          echo "file=$out" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: D-Agent-1.0.${{ github.run_number }}
          path: ${{ steps.apk.outputs.file }}
          if-no-files-found: error

      - name: Publish release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: D-Agent 1.0.${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          files: ${{ steps.apk.outputs.file }}
          make_latest: true
          body: |
            D-Agent 1.0.${{ github.run_number }} for 64-bit Android phones (arm64-v8a).

            Download the APK below on your phone and open it (allow "Install unknown apps" for your browser or file manager).
            Commit: ${{ github.sha }}
