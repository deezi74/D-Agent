name: Character presets

# Draws the built-in characters into app/src/main/assets/characters and commits them.
# Runs when the preset list changes, or by hand (Actions > Character presets > Run workflow).
on:
  push:
    branches: ["claude/**", main]
    paths: ["scripts/presets.json", "scripts/gen-presets.py"]
  workflow_dispatch:
    inputs:
      only:
        description: "Character ids to redraw (space separated); empty = only missing pictures"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  draw:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - run: pip install --quiet pillow
      - name: Draw
        env:
          POLLINATIONS_KEY: ${{ secrets.POLLINATIONS_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.only }}" ]; then python3 scripts/gen-presets.py --force ${{ github.event.inputs.only }}; else python3 scripts/gen-presets.py; fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: characters
          path: app/src/main/assets/characters
          if-no-files-found: ignore
      - name: Commit pictures
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/src/main/assets/characters
          git diff --cached --quiet && exit 0
          git commit -m "Draw built-in character pictures"
          for i in 1 2 3 4; do git pull --rebase origin "${GITHUB_REF_NAME}" && git push origin "HEAD:${GITHUB_REF_NAME}" && exit 0; sleep 5; done
          exit 1
